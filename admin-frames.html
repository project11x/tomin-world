<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin · Frames · Shouli</title>
  <link rel="icon" type="image/png" href="icons/flavicon.png" />
  <style>
    :root { color-scheme: dark; }
    html, body { background: #0b0b0d; color: #fff; margin: 0; min-height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; }
    body { padding: 28px 20px 60px; }
    .wrap { max-width: 1280px; margin: 0 auto; }
    h1 { font-size: 24px; font-weight: 700; margin: 0 0 4px; }
    .sub { font-size: 12px; color: rgba(255,255,255,0.55); margin-bottom: 18px; max-width: 720px; line-height: 1.5; }
    .back { font-size: 12px; color: rgba(255,255,255,0.5); text-decoration: none; }
    .back:hover { color: #fff; }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 16px;
      position: sticky;
      top: 0;
      backdrop-filter: blur(20px);
      z-index: 5;
    }
    .filter { display: flex; gap: 6px; }
    .filter button {
      padding: 5px 12px;
      border-radius: 8px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff; font-size: 11px; font-weight: 600;
      cursor: pointer; font-family: inherit;
    }
    .filter button.active { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.3); }
    .stat { font-size: 11px; opacity: 0.6; margin-left: auto; font-variant-numeric: tabular-nums; }
    .stat strong { color: #fff; opacity: 1; font-weight: 700; }
    .save {
      padding: 7px 14px;
      border-radius: 8px;
      background: #fff;
      color: #0b0b0d;
      border: none;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }
    .save:disabled { opacity: 0.4; cursor: default; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
    .frame {
      background: rgba(255,255,255,0.04);
      border: 2px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
      transition: border-color 140ms ease, background-color 140ms ease;
    }
    .frame:hover { background: rgba(255,255,255,0.07); }
    .frame.approved { border-color: rgba(34,197,94,0.55); }
    .frame.rejected { border-color: rgba(239,68,68,0.55); background: rgba(239,68,68,0.06); }
    .frame.pending  { border-color: rgba(255,255,255,0.15); }
    .frame-thumb { aspect-ratio: 16/9; border-radius: 6px; overflow: hidden; background: #000; }
    .frame-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .frame-meta { font-size: 10px; line-height: 1.3; opacity: 0.7; display: flex; justify-content: space-between; gap: 6px; padding: 0 2px; }
    .frame-meta strong { color: #fff; opacity: 1; font-weight: 600; }
    .state-badge {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 1px 6px;
      border-radius: 4px;
    }
    .frame.approved .state-badge { background: rgba(34,197,94,0.25); color: rgb(134,239,172); }
    .frame.rejected .state-badge { background: rgba(239,68,68,0.25); color: rgb(252,165,165); }
    .frame.pending  .state-badge { background: rgba(255,255,255,0.1);  color: rgba(255,255,255,0.6); }
    .status { font-size: 11px; opacity: 0.6; }
  </style>
</head>
<body>
  <div class="wrap">
    <a href="/" class="back">← back to site</a>
    <h1 style="margin-top:14px;">Frames · Admin</h1>
    <p class="sub">
      Click a frame to cycle through <strong>approved → rejected → pending</strong>. When you're done, hit Save —
      this downloads the updated <code>frames-pool.json</code>. Drop it into <code>public/frames-pool.json</code> and
      <code>npm run deploy</code> to publish.
    </p>

    <div class="toolbar">
      <div class="filter">
        <button data-filter="all" class="active">All</button>
        <button data-filter="approved">Approved</button>
        <button data-filter="rejected">Rejected</button>
        <button data-filter="pending">Pending</button>
      </div>
      <div class="stat" id="stat">—</div>
      <button class="save" id="save" disabled>Save changes</button>
    </div>

    <div class="status" id="status">Loading frames…</div>
    <div class="grid" id="grid"></div>
  </div>

  <script type="module">
    let manifest = null;
    let dirty = false;
    let activeFilter = 'all';

    const grid = document.getElementById('grid');
    const status = document.getElementById('status');
    const stat = document.getElementById('stat');
    const saveBtn = document.getElementById('save');

    async function load() {
      const res = await fetch('/frames-pool.json');
      if (!res.ok) { status.textContent = `Failed (${res.status})`; return; }
      manifest = await res.json();
      status.textContent = '';
      paint();
    }

    function paint() {
      const frames = manifest.frames || [];
      const counts = { approved: 0, rejected: 0, pending: 0 };
      for (const f of frames) counts[f.state] = (counts[f.state] || 0) + 1;
      stat.innerHTML = `
        <span><strong>${counts.approved}</strong> approved</span> ·
        <span><strong>${counts.rejected}</strong> rejected</span> ·
        <span><strong>${counts.pending}</strong> pending</span>
      `;
      const filtered = activeFilter === 'all'
        ? frames
        : frames.filter((f) => f.state === activeFilter);
      grid.innerHTML = '';
      for (const f of filtered) grid.appendChild(renderFrame(f));
      saveBtn.disabled = !dirty;
    }

    // Frame thumbs live on R2 under game/frames/... — same prefix logic
    // as the in-app games. Inline here (rather than importing) because
    // admin-frames.html is a standalone document outside the Vite graph.
    const R2_PUBLIC_BASE = 'https://pub-859f13be44eb4577b0cb23c8d8440a59.r2.dev/';
    function thumbUrl(t) {
      if (!t) return '';
      if (/^https?:\/\//.test(t)) return t;
      return R2_PUBLIC_BASE + t.replace(/^\/+/, '');
    }

    function renderFrame(f) {
      const div = document.createElement('div');
      div.className = `frame ${f.state}`;
      div.innerHTML = `
        <div class="frame-thumb"><img src="${thumbUrl(f.thumb)}" alt="" loading="lazy" /></div>
        <div class="frame-meta">
          <span><strong>${escapeHtml(f.edit)}</strong> · ${f.timestamp.toFixed(1)}s</span>
          <span class="state-badge">${f.state}</span>
        </div>
      `;
      div.addEventListener('click', () => {
        const order = ['approved', 'rejected', 'pending'];
        const next = order[(order.indexOf(f.state) + 1) % order.length];
        f.state = next;
        dirty = true;
        paint();
      });
      return div;
    }

    document.querySelectorAll('.filter button').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter button').forEach((b) => b.classList.toggle('active', b === btn));
        activeFilter = btn.dataset.filter;
        paint();
      });
    });

    saveBtn.addEventListener('click', () => {
      manifest.generated = new Date().toISOString();
      const blob = new Blob([JSON.stringify(manifest, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'frames-pool.json';
      a.click();
      URL.revokeObjectURL(url);
      dirty = false;
      paint();
    });

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, (c) => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c] || c));
    }

    load();
  </script>
</body>
</html>

# Cloudflare Workers (Static Assets) — successor to the Pages project.
#
# Why we moved off Pages:
#   The Pages deployment for tomin-world got into a corrupted asset-storage
#   state where individual JS/CSS files would respond 500 even though the
#   deploy reported "complete". Re-deploys were a coin flip. Workers with
#   Static Assets ships atomic deployments and is the platform CF actively
#   develops, so this is also the long-term path.
#
# Routing model:
#   • /api/portfolio  → src/api/portfolio.js (R2 listing)
#   • /api/status     → src/api/status.js    (Access-protected GH commit)
#   • everything else → ASSETS binding serves dist/ as static
#
# Deploy: `npm run deploy`

name = "tomin-world"
main = "src/worker.js"
compatibility_date = "2026-05-15"
compatibility_flags = ["nodejs_compat"]

# Disable the workers.dev preview URL. The Worker is only reachable via the
# custom domains below, which Cloudflare Access can gate. With this off,
# /api/status cannot be hit on a URL that bypasses Access.
workers_dev = false
preview_urls = false

# Custom domains — must stay declared here so they aren't dropped by a deploy
# that picks up local-vs-remote config drift.
routes = [
  { pattern = "shouli.de", custom_domain = true },
  { pattern = "www.shouli.de", custom_domain = true },
  { pattern = "tomin.world", custom_domain = true },
]

# Static asset serving — the dist/ output of `npm run build`.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Live R2 listing for /api/portfolio.
[[r2_buckets]]
binding = "PORTFOLIO_BUCKET"
bucket_name = "tomin-media"

# D1 SQLite for the Journal engagement layer — pinboard, vote, stamps,
# passport-code state. Local-only for now; `wrangler dev` creates a sqlite
# file under .wrangler/state/v3/d1/. Promote to remote with
# `wrangler d1 create tomin-journal` and copy the returned id below before
# the first deploy.
[[d1_databases]]
binding = "DB"
database_name = "tomin-journal"
# Created 2026-06-06 via `wrangler d1 create tomin-journal` (region WEUR).
# Migrations applied with `wrangler d1 migrations apply tomin-journal --remote`.
database_id = "8af59846-b5a6-4059-bfc3-fc0501c166b6"
migrations_dir = "migrations"

# Non-secret env vars. Secrets (GH_TOKEN, CF_ACCESS_AUD) live separately —
# set them once with `npx wrangler secret put <NAME>`.
[vars]
GH_REPO = "project11x/tomin-world"
ADMIN_EMAILS = "ed.wut@icloud.com"
CF_ACCESS_TEAM_DOMAIN = "shouli-admin.cloudflareaccess.com"

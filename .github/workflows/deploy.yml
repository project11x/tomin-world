# Auto-deploy to Cloudflare Workers on every push to main.
#
# Why GitHub Actions and not Cloudflare's own build CI:
#   The old Pages CI got into a corrupted state and produced 500-on-/ deploys
#   from clean source. GitHub Actions runs the same `npm run deploy` we run
#   locally — wrangler bundles & pushes directly. No CF build backend in the
#   middle, fully transparent logs, easy to pause via the Actions tab.
#
# Required GitHub secret:
#   CLOUDFLARE_API_TOKEN — token with "Workers Scripts:Edit" and
#                          "Workers R2 Storage:Edit" permissions, scoped to
#                          the tomin-world account.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # allows manual trigger from the Actions tab

# Cancel in-flight runs if a newer commit lands — we only ever care about
# deploying the latest main.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Daily Frame · Shouli</title>
  <link rel="icon" type="image/png" href="icons/flavicon.png" />

  <script>
    // Same theme bootstrap as index.html — avoids flash on load.
    (function () {
      var theme = localStorage.getItem('ios-theme') || 'auto';
      var dark = theme === 'dark' ||
        ((theme === 'auto' || !theme) && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.add(dark ? 'dark' : 'light');
      document.documentElement.classList.add(dark ? 'ios-dark' : '');
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="tailwind.css" />
  <link rel="stylesheet" href="styles.css" />

  <style>
    /* ── Page chrome ───────────────────────────────────────────────── */
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 48px 20px 80px;
      background: var(--df-bg, #f4f2ee);
      color: var(--df-fg, #0b0b0d);
      transition: background 0.3s, color 0.3s;
    }

    html.dark body {
      --df-bg: #06080f;
      --df-fg: #f4f2ee;
      background: linear-gradient(160deg, #06080f 0%, #0a0e20 50%, #0e0618 100%);
    }

    .df-shell {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .df-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-align: center;
    }

    .df-eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.5;
    }

    .df-title {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0;
    }

    .df-sub {
      font-size: 13px;
      opacity: 0.5;
      font-weight: 500;
    }

    /* ── Frame display ─────────────────────────────────────────────── */
    .df-frame-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 16px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.05);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.12);
    }

    html.dark .df-frame-wrap {
      background: rgba(255, 255, 255, 0.04);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
    }

    .df-frame {
      width: 100%;
      height: 100%;
      object-fit: cover;
      will-change: transform, filter;
    }
    /* Transitions are only enabled AFTER the first paint, so the image
       appears already-zoomed instead of dramatically zooming in on load.
       JS adds .is-ready in a double-rAF after render. Subsequent reveals
       (after wrong guesses) still get the smooth 600ms transition. */
    .df-frame.is-ready {
      transition: transform 600ms cubic-bezier(0.4, 0, 0.2, 1),
        filter 600ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Attempt 1: heavy zoom + heavy blur */
    .df-frame[data-attempt="1"] {
      transform: scale(5);
      filter: blur(10px);
    }

    /* Attempt 2: medium zoom + medium blur */
    .df-frame[data-attempt="2"] {
      transform: scale(2.5);
      filter: blur(4px);
    }

    /* Attempt 3: almost full, slight haze */
    .df-frame[data-attempt="3"] {
      transform: scale(1.3);
      filter: blur(1px);
    }

    /* Reveal: original */
    .df-frame[data-attempt="reveal"] {
      transform: scale(1);
      filter: blur(0);
    }

    /* ── Attempt dots ──────────────────────────────────────────────── */
    .df-dots {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .df-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.12);
      transition: background 0.3s;
    }

    html.dark .df-dot {
      background: rgba(255, 255, 255, 0.12);
    }

    .df-dot.wrong { background: #ef4444; }
    .df-dot.correct { background: #22c55e; }

    /* ── Guess input ───────────────────────────────────────────────── */
    .df-guess-wrap {
      position: relative;
      width: 100%;
    }

    .df-guess-input {
      width: 100%;
      padding: 14px 18px;
      font-size: 15px;
      font-weight: 500;
      border-radius: 14px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      background: rgba(255, 255, 255, 0.8);
      color: inherit;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
      font-family: inherit;
    }

    html.dark .df-guess-input {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.1);
    }

    .df-guess-input:focus {
      border-color: rgba(0, 0, 0, 0.3);
    }

    html.dark .df-guess-input:focus {
      border-color: rgba(255, 255, 255, 0.3);
    }

    .df-suggestions {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 14px;
      overflow: hidden;
      max-height: 240px;
      overflow-y: auto;
      z-index: 10;
      display: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    html.dark .df-suggestions {
      background: rgba(20, 22, 28, 0.95);
      border-color: rgba(255, 255, 255, 0.08);
    }

    .df-suggestions.show { display: block; }

    .df-suggestion {
      padding: 12px 18px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .df-suggestion:hover,
    .df-suggestion[data-active="true"] {
      background: rgba(0, 0, 0, 0.05);
    }

    html.dark .df-suggestion:hover,
    html.dark .df-suggestion[data-active="true"] {
      background: rgba(255, 255, 255, 0.06);
    }

    .df-suggestion + .df-suggestion {
      border-top: 1px solid rgba(0, 0, 0, 0.04);
    }

    html.dark .df-suggestion + .df-suggestion {
      border-top-color: rgba(255, 255, 255, 0.04);
    }

    /* ── Guess button ──────────────────────────────────────────────── */
    .df-guess-btn {
      width: 100%;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 14px;
      border: none;
      background: #0b0b0d;
      color: #fff;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      font-family: inherit;
    }

    html.dark .df-guess-btn {
      background: #f4f2ee;
      color: #0b0b0d;
    }

    .df-guess-btn:hover { opacity: 0.85; }
    .df-guess-btn:active { transform: scale(0.98); }
    .df-guess-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* ── Previous guesses ──────────────────────────────────────────── */
    .df-history {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .df-history-item {
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.15);
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    html.dark .df-history-item {
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.2);
    }

    /* ── Result view ───────────────────────────────────────────────── */
    .df-result {
      display: none;
      flex-direction: column;
      gap: 18px;
      align-items: center;
      text-align: center;
    }

    .df-result.show { display: flex; }

    .df-result-headline {
      font-size: 22px;
      font-weight: 700;
      margin: 0;
    }

    .df-result-emojis {
      font-size: 28px;
      letter-spacing: 6px;
    }

    .df-result-answer {
      font-size: 14px;
      opacity: 0.55;
      font-weight: 500;
    }

    .df-result-actions {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .df-result-btn {
      flex: 1;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 12px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      background: rgba(255, 255, 255, 0.6);
      color: inherit;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s, transform 0.1s;
    }

    html.dark .df-result-btn {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.1);
    }

    .df-result-btn:hover { background: rgba(0, 0, 0, 0.04); }
    html.dark .df-result-btn:hover { background: rgba(255, 255, 255, 0.1); }
    .df-result-btn:active { transform: scale(0.98); }

    .df-result-btn.primary {
      background: #0b0b0d;
      color: #fff;
      border-color: #0b0b0d;
    }

    html.dark .df-result-btn.primary {
      background: #f4f2ee;
      color: #0b0b0d;
      border-color: #f4f2ee;
    }

    .df-result-btn.primary:hover { opacity: 0.85; background: #0b0b0d; }
    html.dark .df-result-btn.primary:hover { background: #f4f2ee; }

    .df-countdown {
      font-size: 12px;
      opacity: 0.45;
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    /* ── States ────────────────────────────────────────────────────── */
    .df-loading,
    .df-error {
      text-align: center;
      padding: 80px 20px;
      opacity: 0.5;
      font-size: 14px;
    }

    /* Hide playing UI when result shown */
    .df-shell.has-result .df-input-area {
      display: none;
    }

    /* Back link */
    .df-back {
      position: fixed;
      top: 20px;
      left: 20px;
      font-size: 13px;
      opacity: 0.5;
      text-decoration: none;
      color: inherit;
      transition: opacity 0.2s;
    }

    .df-back:hover { opacity: 1; }

    /* Toast for copy confirmation */
    .df-toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      padding: 10px 18px;
      background: rgba(34, 197, 94, 0.95);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      border-radius: 20px;
      opacity: 0;
      transition: transform 0.3s, opacity 0.3s;
      pointer-events: none;
      z-index: 100;
    }

    .df-toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>

<body>
  <a href="/" class="df-back">← back to site</a>

  <div class="df-shell" id="df-shell">
    <div class="df-loading" id="df-loading">Loading today's puzzle…</div>
  </div>

  <div class="df-toast" id="df-toast">Copied to clipboard</div>

  <script type="module" src="src/games/daily-frame.js"></script>
</body>

</html>
